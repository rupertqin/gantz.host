name: Deploy Website

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install

    - name: Get Git Hash
      id: git-hash
      run: echo "PUBLIC_GIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

    - name: Build
      run: npm run build
      env:
        PUBLIC_GIT_HASH: ${{ env.PUBLIC_GIT_HASH }}

    - name: Deploy to server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        passphrase: ${{ secrets.PASSPHRASE }}
        source: dist/*
        target: ${{ secrets.REMOTE_TARGET }}
        strip_components: 1
