<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 40 40">
    <!-- Logo background -->
    <rect width="40" height="40" rx="8" fill="url(#logo-gradient)" />

    <!-- Abstract tech elements -->
    <path d="M10 20C10 14.4772 14.4772 10 20 10C25.5228 10 30 14.4772 30 20C30 25.5228 25.5228 30 20 30"
          stroke="white" stroke-width="2.5" stroke-linecap="round" />
    <path d="M20 30C17.2386 30 15 27.7614 15 25C15 22.2386 17.2386 20 20 20"
          stroke="white" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="20" cy="20" r="2" fill="white" />
    <circle cx="28" cy="14" r="2" fill="white" />

    <!-- Data/circuit lines -->
    <path d="M20 18L28 12" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="1 2" />
    <path d="M22 20L30 20" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="1 2" />

    <!-- Gradient definition -->
    <defs>
        <linearGradient id="logo-gradient" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#3B82F6" /> <!-- blue-500 -->
            <stop offset="100%" stop-color="#8B5CF6" /> <!-- purple-500 -->
        </linearGradient>
    </defs>

    <style>
        @media (prefers-color-scheme: dark) {
            rect { fill: url(#logo-gradient); }
        }
    </style>
</svg>
