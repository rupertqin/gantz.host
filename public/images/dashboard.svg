<svg viewBox="0 0 500 300" xmlns="http://www.w3.org/2000/svg">
    <!-- 背景 -->
    <rect x="10" y="10" width="480" height="280" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />

    <!-- 顶部导航栏 -->
    <rect x="10" y="10" width="480" height="40" rx="10" fill="#f1f5f9" />
    <circle cx="35" cy="30" r="8" fill="#3b82f6" />
    <circle cx="65" cy="30" r="8" fill="#8b5cf6" />

    <!-- 侧边栏 -->
    <rect x="10" y="50" width="100" height="240" fill="#f1f5f9" />
    <rect x="25" y="70" width="70" height="10" rx="2" fill="#cbd5e1" />
    <rect x="25" y="90" width="70" height="10" rx="2" fill="#cbd5e1" />
    <rect x="25" y="110" width="70" height="10" rx="2" fill="#cbd5e1" />
    <rect x="25" y="130" width="70" height="10" rx="2" fill="#cbd5e1" />
    <rect x="25" y="150" width="70" height="10" rx="2" fill="#cbd5e1" />

    <!-- 主内容区 - 图表 -->
    <rect x="130" y="70" width="340" height="100" rx="5" fill="#f1f5f9" />
    <polyline points="150,140 190,100 230,120 270,90 310,110 350,80 390,95 430,70"
        fill="none" stroke="#3b82f6" stroke-width="3" />
    <circle cx="190" cy="100" r="4" fill="#3b82f6" />
    <circle cx="230" cy="120" r="4" fill="#3b82f6" />
    <circle cx="270" cy="90" r="4" fill="#3b82f6" />
    <circle cx="310" cy="110" r="4" fill="#3b82f6" />
    <circle cx="350" cy="80" r="4" fill="#3b82f6" />
    <circle cx="390" cy="95" r="4" fill="#3b82f6" />

    <!-- 卡片1 -->
    <rect x="130" y="190" width="160" height="80" rx="5" fill="#ede9fe" />
    <rect x="145" y="205" width="60" height="10" rx="2" fill="#8b5cf6" />
    <rect x="145" y="225" width="130" height="10" rx="2" fill="#a78bfa" opacity="0.7" />
    <rect x="145" y="245" width="100" height="10" rx="2" fill="#a78bfa" opacity="0.7" />

    <!-- 卡片2 -->
    <rect x="310" y="190" width="160" height="80" rx="5" fill="#dbeafe" />
    <rect x="325" y="205" width="60" height="10" rx="2" fill="#3b82f6" />
    <rect x="325" y="225" width="130" height="10" rx="2" fill="#60a5fa" opacity="0.7" />
    <rect x="325" y="245" width="100" height="10" rx="2" fill="#60a5fa" opacity="0.7" />

    <!-- 动画元素 -->
    <circle cx="450" cy="30" r="8" fill="#10b981" class="pulse-circle" />
</svg>
